name: Deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The version shown on the site comes from the newest hinata-app tag, resolved
  # at build time. A nightly rebuild picks up releases that shipped without a
  # docs change; hinata-app can also trigger one immediately by POSTing a
  # repository_dispatch with event_type "app-release" (needs a PAT with
  # contents:write on this repo). Between rebuilds assets/version.js keeps the
  # already-published pages current in the browser.
  schedule:
    - cron: "17 4 * * *"
  repository_dispatch:
    types: [app-release]

# Allow the workflow to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deploy; newer pushes cancel in-flight runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build static site
        run: python build.py
        env:
          # Authenticated GitHub API calls (version lookup) — shared runner IPs
          # burn through the 60/h anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
